name: Resolve GPUI Deck lock
on:
  push:
    branches: [main]
    paths: ['.github/workflows/resolve-deck-lock.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve only the new UI dependency and required engine family
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('crates/mixlive-app/Cargo.toml')
          text = manifest.read_text()
          old = 'gpui-design = { git = "https://github.com/andongmin94/gpui-design", rev = "385b0178fbbaa3d30de79fe04329aab62a257dc0" }'
          new = 'gpui-deck = { git = "https://github.com/andongmin94/gpui-deck", rev = "78c0898ccb6feba03e3a3243ac7d4729fd80aee6" }'
          assert text.count(old) == 1 and text.count('=0.3.11') == 2
          manifest.write_text(text.replace(old, new).replace('=0.3.11', '=0.3.12'))
          PY
          cargo update --workspace
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, tomllib
          raw = Path('Cargo.lock').read_bytes()
          packages = tomllib.loads(raw.decode())['package']
          assert not any(p['name'] == 'gpui-design' for p in packages)
          assert all(p['version'] == '0.3.12' for p in packages if p['name'].startswith('gpui-pre'))
          assert any(p['name'] == 'gpui-deck' and p['version'] == '0.0.1' and p['source'].endswith('#78c0898ccb6feba03e3a3243ac7d4729fd80aee6') for p in packages)
          print('MIXLIVE_LOCK_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('MIXLIVE_LOCK_BEGIN')
          print(raw.decode(), end='')
          print('MIXLIVE_LOCK_END')
          PY
