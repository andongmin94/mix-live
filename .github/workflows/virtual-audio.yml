name: Virtual Audio
on:
  push:
    branches: [main]
    paths: ['drivers/virtual-audio/**', '.github/workflows/virtual-audio.yml']
  pull_request:
    paths: ['drivers/virtual-audio/**', '.github/workflows/virtual-audio.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: virtual-audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    # windows-2025 now resolves to VS 2026; windows-2022 includes VS 2022 + WDK 26100.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test the actual driver transport without loading a kernel driver
        shell: pwsh
        run: |
          cmake -S drivers/virtual-audio -B "$env:RUNNER_TEMP/mixlive-transport" -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/mixlive-transport" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/mixlive-transport" -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and link the unsigned x64 driver
        shell: pwsh
        run: |
          ./drivers/virtual-audio/build-driver.ps1 -WdkVersion '10.0.26100.0' -Output "$env:RUNNER_TEMP/mixlive-driver"
      - name: Validate INF and generate the unsigned catalog
        shell: pwsh
        run: |
          ./drivers/virtual-audio/prepare-package.ps1 -PackageDirectory "$env:RUNNER_TEMP/mixlive-driver"
      - name: Check development package boundary without changing devices
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP/mixlive-driver"
          $rejected = $false
          try {
            ./drivers/virtual-audio/manage-devices.ps1 -Action Verify -PackageDirectory $package
          } catch {
            if ($_.Exception.Message -notlike 'Kernel-policy signature verification failed:*') { throw }
            $rejected = $true
          }
          if (!$rejected) { throw 'Unsigned catalog was not rejected' }
          Write-Output 'Unsigned package cannot pass the signed-package preflight.'
          # PnP discovery is read-only. Print only the result count, not runner hardware IDs.
          $rows = @(./drivers/virtual-audio/manage-devices.ps1 -Action Status)
          $expected = @('Root\MixLive_Call', 'Root\MixLive_Broadcast', 'Root\MixLive_Return')
          if (($rows.HardwareId -join ';') -cne ($expected -join ';') -or
              @($rows | Where-Object { $_.State -ne 'Absent' }).Count -ne 0) {
            throw 'The clean runner should report exactly the three absent MixLive cable IDs'
          }
          Write-Output 'All three MixLive device IDs are absent; no device state was modified.'
          # SignTool deliberately failed above. All assertions succeeded, so do not
          # propagate that expected native exit code through Actions' pwsh wrapper.
          exit 0
      - name: Keep unsigned package for driver development only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: virtual-audio-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/mixlive-driver/
          retention-days: 7
          if-no-files-found: error
