name: Audio
on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Test core and clock boundaries
        run: cargo test --workspace --locked
      - name: Lint current targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Windows device prototype
        run: cargo build --release -p mixlive-audio-windows --bin mixlive-audio --locked
      - name: Check CLI without opening devices
        run: ./target/release/mixlive-audio.exe --help
      - name: Keep development binary and resolved dependencies
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-audio-dev-${{ github.sha }}
          path: |
            Cargo.lock
            target/release/mixlive-audio.exe
          retention-days: 7
