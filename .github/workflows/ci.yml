name: Audio
on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Test routing, clock boundaries, vocal processing, Scene UI state and plugin files
        run: cargo test --workspace --locked
      - name: Fetch the existing gain fixture (source only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: coupler-rs/vst3-rs
          ref: b2a45f2d40e602eff5a224b41613735388868590
          path: .fixtures/vst3-rs
          persist-credentials: false
      - name: Fetch the existing state fixture (source only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HelgeSverre/rust-vst3-host
          ref: 6c64cdffc6740cce0b4c5b6916724697b0ef9ff8
          path: .fixtures/rust-vst3-host
          persist-credentials: false
      - name: Build two native fixtures without installing plugins
        run: |
          $fixtureTarget = Join-Path $env:RUNNER_TEMP 'mixlive-vst3-fixtures'
          cargo build --manifest-path .fixtures/vst3-rs/Cargo.toml -p vst3 --example gain --target-dir $fixtureTarget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path .fixtures/rust-vst3-host/Cargo.toml -p vst3-host-testplug --lib --target-dir $fixtureTarget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gain = Join-Path $fixtureTarget 'gain.vst3'
          $state = Join-Path $fixtureTarget 'state.vst3'
          Copy-Item (Join-Path $fixtureTarget 'debug/examples/gain.dll') $gain
          Copy-Item (Join-Path $fixtureTarget 'debug/vst3_host_testplug.dll') $state
          "MIXLIVE_GAIN_VST3=$gain" >> $env:GITHUB_ENV
          "MIXLIVE_STATE_VST3=$state" >> $env:GITHUB_ENV
      - name: Check native VST3 worker, state, editor contracts and WAV output
        run: cargo test -p mixlive-vst3 -p mixlive-audio-windows --tests --locked -- --ignored
      - name: Lint current targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Windows app and development tools
        run: cargo build --release -p mixlive-app -p mixlive-audio-windows -p mixlive-vst3 --bins --locked
      - name: Check CLIs without opening devices
        run: |
          ./target/release/mixlive-audio.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/mixlive-audio.exe apps | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/mixlive-audio.exe run --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/mixlive-plugins.exe inspect --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/mixlive-plugins.exe render --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/mixlive-plugins.exe edit --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native Scene creation, device and sound editing without opening audio or plugins
        shell: powershell
        timeout-minutes: 3
        env:
          # Preserve Unicode labels when the generated script is read by Windows PowerShell 5.1.
          MIXLIVE_UI_NEW: '새 Scene'
          MIXLIVE_UI_START: '오디오 시작'
          MIXLIVE_UI_SAVE: '새 Scene 파일로 저장'
          MIXLIVE_UI_CANCEL: '새 Scene 취소'
          MIXLIVE_UI_MIC: '내 목소리 · 필수'
          MIXLIVE_UI_OUTPUT: '주 출력 · 필수'
          MIXLIVE_UI_AUX: 'AUX / MR · 선택'
          MIXLIVE_UI_SEND: '추가 송출 · 선택'
          MIXLIVE_UI_BROADCAST: '방송 송출 · 선택'
          MIXLIVE_UI_REQUIRED: '내 목소리 입력 장치를 선택하세요.'
          MIXLIVE_UI_DEVICES: '장치·출력 설정'
          MIXLIVE_UI_MISSING_PREFIX: '현재 없는 장치 · '
          MIXLIVE_UI_MISSING: '내 목소리 입력 장치가 조회한 목록에 없습니다. 장치 설정을 다시 열어 장치를 확인하세요.'
          MIXLIVE_UI_MIC_CHANNEL: '마이크 채널'
          MIXLIVE_UI_AUX_CHANNELS: 'AUX 채널'
          MIXLIVE_UI_OUTPUT_CHANNELS: '주 출력 채널'
          MIXLIVE_UI_SEND_CHANNELS: '추가 송출 채널'
          MIXLIVE_UI_BROADCAST_CHANNELS: '방송 송출 채널'
          MIXLIVE_UI_OUTPUT_GAIN: '전체 시작 음량'
          MIXLIVE_UI_SEND_GAIN: '추가 송출 시작 음량'
          MIXLIVE_UI_MONITOR_GAIN: '모니터 시작 음량'
          MIXLIVE_UI_BROADCAST_GAIN: '방송 송출 시작 음량'
          MIXLIVE_UI_AUX_GAIN: 'AUX 입력 음량'
          MIXLIVE_UI_QUEUE: '장치별 queue 목표'
          MIXLIVE_UI_EDIT: '보컬 설정'
          MIXLIVE_UI_TRIM: '마이크 입력 trim'
          MIXLIVE_UI_REVERB: '리버브 비율'
          MIXLIVE_UI_REVERB_DECAY: '잔향 시간'
          MIXLIVE_UI_REVERB_PREDELAY: '리버브 pre-delay'
          MIXLIVE_UI_ECHO: '에코 비율'
          MIXLIVE_UI_ECHO_TIME: '에코 시간'
          MIXLIVE_UI_ECHO_FEEDBACK: '에코 피드백'
          MIXLIVE_UI_BLEND: '보컬 보정 비율'
          MIXLIVE_UI_MOVE_SECOND: 'VST3 2 위로'
          MIXLIVE_UI_SCAN_VST3: '설치된 VST3 검색'
          MIXLIVE_UI_SCAN_COMPLETE: '설치된 VST3 다시 검색'
          MIXLIVE_UI_EQ_HPF: '하이패스 주파수'
          MIXLIVE_UI_EQ_BODY: '저역 EQ 보정'
          MIXLIVE_UI_RATIO: '컴프레서 ratio'
          MIXLIVE_UI_DEESS_MAX: '디에서 최대 감쇠'
          MIXLIVE_UI_THIRD_SLOT: 'VST3 3 위로'
          MIXLIVE_UI_BYPASS_SECOND_ON: 'VST3 2 우회 켜기'
          MIXLIVE_UI_BYPASS_SECOND_OFF: 'VST3 2 우회 끄기'
          MIXLIVE_UI_WORKSPACE: 'Scene 작업 영역'
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms
          if ([Threading.Thread]::CurrentThread.ApartmentState -ne [Threading.ApartmentState]::STA) {
            throw 'Native save keyboard verification requires the Windows PowerShell STA thread'
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeDialogWindow {
              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool SetForegroundWindow(IntPtr window);
              [DllImport("user32.dll")]
              public static extern IntPtr GetForegroundWindow();
          }
          '@
          function Find-UiName([string]$name) {
            $condition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, $name)
            $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
          }
          function Wait-UiName([string]$name, [switch]$Enabled) {
            $limit = [DateTime]::UtcNow.AddSeconds(10)
            do {
              $app.Refresh()
              if ($app.HasExited) { throw "MixLive exited while waiting for a control: $($app.ExitCode)" }
              $element = Find-UiName $name
              if ($null -ne $element -and (!$Enabled -or $element.Current.IsEnabled)) { return $element }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $limit)
            throw "MixLive did not expose the expected control: $name"
          }
          function Invoke-UiName([string]$name) {
            $element = Wait-UiName $name -Enabled
            $element.SetFocus()
            # GPUI Deck buttons request native autoscroll on focus. Wait for the revealed frame.
            $limit = [DateTime]::UtcNow.AddSeconds(10)
            do {
              $element = Wait-UiName $name -Enabled
              $area = (Wait-UiName $env:MIXLIVE_UI_WORKSPACE).Current.BoundingRectangle
              $bounds = $element.Current.BoundingRectangle
              $focused = $element.Current.HasKeyboardFocus
              $centerX = $bounds.Left + $bounds.Width / 2
              $centerY = $bounds.Top + $bounds.Height / 2
              # GPUI activates at the AX bounds center. Button focus reveal excludes its 1px border.
              if ($focused -and $bounds.Width -gt 0 -and $bounds.Height -gt 0 -and
                  $centerY -gt $area.Top -and $centerY -lt $area.Bottom -and
                  $centerX -gt $area.Left -and $centerX -lt $area.Right) {
                Write-Output ("UIA Invoke {0}: focused={1}; bounds={2}; workspace={3}; center=({4},{5})" -f
                  $name, $focused, $bounds, $area, $centerX, $centerY)
                ([System.Windows.Automation.InvokePattern]$element.GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
                return
              }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $limit)
            throw ("MixLive did not focus and reveal the activation point: {0}; focused={1}; bounds={2}; workspace={3}; center=({4},{5})" -f
              $name, $focused, $bounds, $area, $centerX, $centerY)
          }
          function Read-UiValue([string]$name, [switch]$AllowDisabled) {
            $element = Wait-UiName $name -Enabled:(!$AllowDisabled)
            ([System.Windows.Automation.ValuePattern]$element.GetCurrentPattern(
              [System.Windows.Automation.ValuePattern]::Pattern)).Current.Value
          }
          function Set-UiValue([string]$name, [string]$value) {
            $element = Wait-UiName $name -Enabled
            ([System.Windows.Automation.ValuePattern]$element.GetCurrentPattern(
              [System.Windows.Automation.ValuePattern]::Pattern)).SetValue($value)
            $limit = [DateTime]::UtcNow.AddSeconds(10)
            do {
              if ((Read-UiValue $name) -ceq $value) { return }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $limit)
            throw "MixLive did not apply the edited value: $name"
          }
          $app = Start-Process ./target/release/mixlive.exe -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
            } while (!$app.HasExited -and $app.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($app.HasExited) { throw "MixLive exited before opening its window: $($app.ExitCode)" }
            if ($app.MainWindowHandle -eq 0) { throw 'MixLive did not open its native window' }
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
            $new = Wait-UiName $env:MIXLIVE_UI_NEW -Enabled
            $start = Wait-UiName $env:MIXLIVE_UI_START
            if ($start.Current.IsEnabled) { throw 'Audio start must be disabled without a saved Scene' }
            ([System.Windows.Automation.InvokePattern]$new.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $save = Wait-UiName $env:MIXLIVE_UI_SAVE -Enabled
            $cancel = Wait-UiName $env:MIXLIVE_UI_CANCEL -Enabled
            foreach ($label in @($env:MIXLIVE_UI_MIC, $env:MIXLIVE_UI_OUTPUT)) {
              $select = Wait-UiName $label
              if ($select.Current.ControlType -ne [System.Windows.Automation.ControlType]::ComboBox) {
                throw "A required device control is not a native-accessible select: $label"
              }
              $value = $select.GetCurrentPropertyValue([System.Windows.Automation.ValuePattern]::ValueProperty, $true)
              if ($value -ne [System.Windows.Automation.AutomationElement]::NotSupported -and
                  ![string]::IsNullOrEmpty([string]$value)) {
                throw "A required device was selected automatically: $label"
              }
            }
            ([System.Windows.Automation.InvokePattern]$save.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $null = Wait-UiName $env:MIXLIVE_UI_REQUIRED
            $cancel = Wait-UiName $env:MIXLIVE_UI_CANCEL -Enabled
            ([System.Windows.Automation.InvokePattern]$cancel.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $null = Wait-UiName $env:MIXLIVE_UI_NEW -Enabled
            if ($null -ne (Find-UiName $env:MIXLIVE_UI_SAVE)) { throw 'New Scene form remained after cancelling' }
            $start = Wait-UiName $env:MIXLIVE_UI_START
            if ($start.Current.IsEnabled) { throw 'Cancelling an unsaved Scene must not enable audio start' }
            if (!$app.CloseMainWindow()) { throw 'MixLive did not accept window close' }
            if (!$app.WaitForExit(10000)) { throw 'MixLive did not exit after closing the screen' }
            if ($app.ExitCode -ne 0) { throw "MixLive exited with code $($app.ExitCode)" }
            Write-Output 'Native New Scene form, required-device validation, cancel and normal exit passed.'
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

          # Synthetic IDs verify missing-device edits; vocal editing and saving remain file-only.
          $sceneDirectory = Join-Path $env:RUNNER_TEMP ('mixlive-scene-ui-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $sceneDirectory
          $originalPath = Join-Path $sceneDirectory 'Original scene.mixlive-scene.json'
          $savedPath = Join-Path $sceneDirectory 'Edited scene.mixlive-scene.json'
          $pluginPath = Join-Path $sceneDirectory 'not-installed.vst3'
          $scene = [ordered]@{
            schema = 11
            route = [ordered]@{
              input = 'ci-absent-mic'; input_channel = 2
              aux_input = 'ci-absent-aux'; aux_channels = @(4, 3); aux_gain_db = -9; aux_to = 'both'
              apps = @(
                [ordered]@{ path = 'C:\ci-fixtures\missing-browser.exe'; channels = @(1, 2); gain_db = -12; to = 'send'; muted = $false; output_gain_db = -7; send_gain_db = -3; broadcast_gain_db = -13 },
                [ordered]@{ path = 'C:\ci-fixtures\missing-call.exe'; channels = @(2, 1); gain_db = -9; to = 'output'; muted = $true; output_gain_db = -5; send_gain_db = -11; broadcast_gain_db = -2 }
              )
              output = 'ci-absent-output'; output_channels = @(4, 3)
              send = 'ci-absent-send'; send_channels = @(1)
              broadcast = 'ci-absent-broadcast'; broadcast_channels = @(2, 1)
              input_gain_db = 1.25; output_gain_db = -23; monitor_gain_db = -4; send_gain_db = -6; broadcast_gain_db = -11
              vocal = 'warm'; vocal_strength = 0.75; vocal_threshold_db = -20; deess_threshold_db = -28
              eq_hpf_hz = 75; eq_body_db = 0; eq_presence_db = 0; eq_air_db = 0
              compressor_ratio = 2.5; compressor_attack_ms = 8; compressor_release_ms = 140; deess_max_db = 4
              reverb_mix = 0.125; reverb_decay_secs = 1.75; reverb_predelay_ms = 12.5
              echo_mix = 0.125; echo_time_ms = 300; echo_feedback = 0.25
              queue_ms = 20
              mix = [ordered]@{
                mute_mic = $true; mute_aux = $false; mute_output = $false; mute_send = $true; mute_broadcast = $false; mute_all = $true
                mic_output_enabled = $false; mic_send_enabled = $true; mic_broadcast_enabled = $false
                mic_output_gain_db = -13; mic_send_gain_db = -7; mic_broadcast_gain_db = -3; aux_output_gain_db = -11; aux_send_gain_db = -12; aux_broadcast_gain_db = -5
              }
            }
            effects = @(
              [ordered]@{ plugin = $pluginPath; class_id = '0123456789ABCDEF0123456789ABCDEF'; state = @(1, 2); bypassed = $false },
              [ordered]@{ plugin = $pluginPath; class_id = 'FEDCBA9876543210FEDCBA9876543210'; state = @(3, 4); bypassed = $false }
            )
          }
          [IO.File]::WriteAllText($originalPath, ($scene | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))
          $originalHash = (Get-FileHash -LiteralPath $originalPath -Algorithm SHA256).Hash
          $app = Start-Process ./target/release/mixlive.exe -ArgumentList ('"{0}"' -f $originalPath) -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
            } while (!$app.HasExited -and $app.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($app.HasExited) { throw "MixLive exited before opening the synthetic Scene: $($app.ExitCode)" }
            if ($app.MainWindowHandle -eq 0) { throw 'MixLive did not open its Scene window' }
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
            $null = Wait-UiName $env:MIXLIVE_UI_START -Enabled

            $bindings = @(
              @($env:MIXLIVE_UI_MIC, 'ci-absent-mic', $env:MIXLIVE_UI_MIC_CHANNEL, '2'),
              @($env:MIXLIVE_UI_AUX, 'ci-absent-aux', $env:MIXLIVE_UI_AUX_CHANNELS, '4,3'),
              @($env:MIXLIVE_UI_OUTPUT, 'ci-absent-output', $env:MIXLIVE_UI_OUTPUT_CHANNELS, '4,3'),
              @($env:MIXLIVE_UI_SEND, 'ci-absent-send', $env:MIXLIVE_UI_SEND_CHANNELS, '1'),
              @($env:MIXLIVE_UI_BROADCAST, 'ci-absent-broadcast', $env:MIXLIVE_UI_BROADCAST_CHANNELS, '2,1')
            )
            $startupValues = @(
              @($env:MIXLIVE_UI_OUTPUT_GAIN, '-23'),
              @($env:MIXLIVE_UI_SEND_GAIN, '-6'),
              @($env:MIXLIVE_UI_MONITOR_GAIN, '-4'),
              @($env:MIXLIVE_UI_BROADCAST_GAIN, '-11'),
              @($env:MIXLIVE_UI_AUX_GAIN, '-9'),
              @($env:MIXLIVE_UI_QUEUE, '20')
            )
            # Reopening after cancelling must load the original values, including optional IDs.
            for ($attempt = 0; $attempt -lt 2; $attempt++) {
              Invoke-UiName $env:MIXLIVE_UI_DEVICES
              $null = Wait-UiName $env:MIXLIVE_UI_SAVE -Enabled
              if ((Wait-UiName $env:MIXLIVE_UI_START).Current.IsEnabled) { throw 'Audio start must be disabled during device editing' }
              foreach ($binding in $bindings) {
                $select = Wait-UiName $binding[0] -Enabled
                if ($select.Current.ControlType -ne [System.Windows.Automation.ControlType]::ComboBox) {
                  throw "A saved device control is not a native-accessible select: $($binding[0])"
                }
                if ((Read-UiValue $binding[0]) -cne ($env:MIXLIVE_UI_MISSING_PREFIX + $binding[1])) {
                  throw "Device editing lost or replaced a missing saved endpoint: $($binding[1])"
                }
                $channels = Wait-UiName $binding[2]
                if ($channels.Current.IsEnabled) { throw "Unavailable endpoint channels must remain read-only: $($binding[2])" }
                if ((Read-UiValue $binding[2] -AllowDisabled) -cne $binding[3]) {
                  throw "Device editing changed saved channels: $($binding[2])"
                }
              }
              foreach ($entry in $startupValues) {
                if ((Read-UiValue $entry[0]) -cne $entry[1]) {
                  throw "Device editing changed a saved startup value: $($entry[0])"
                }
              }
              if ($attempt -eq 0) {
                Invoke-UiName $env:MIXLIVE_UI_SAVE
                $null = Wait-UiName $env:MIXLIVE_UI_MISSING
                $null = Wait-UiName $env:MIXLIVE_UI_SAVE -Enabled
                $invalidSaveDialog = [System.Windows.Automation.AndCondition]::new(
                  [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id),
                  [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ClassNameProperty, '#32770'))
                if ([System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                    [System.Windows.Automation.TreeScope]::Descendants, $invalidSaveDialog).Count -ne 0) {
                  throw 'Invalid device settings opened a native save dialog'
                }
                Set-UiValue $env:MIXLIVE_UI_OUTPUT_GAIN '-31'
                Set-UiValue $env:MIXLIVE_UI_SEND_GAIN '-14'
                Set-UiValue $env:MIXLIVE_UI_MONITOR_GAIN '-9'
                Set-UiValue $env:MIXLIVE_UI_BROADCAST_GAIN '-17'
                Set-UiValue $env:MIXLIVE_UI_AUX_GAIN '-15'
                Set-UiValue $env:MIXLIVE_UI_QUEUE '40'
              }
              Invoke-UiName $env:MIXLIVE_UI_CANCEL
              $null = Wait-UiName $env:MIXLIVE_UI_START -Enabled
              if ((Get-FileHash -LiteralPath $originalPath -Algorithm SHA256).Hash -ne $originalHash) {
                throw 'Cancelling device edits changed the original Scene file'
              }
            }
            Write-Output 'Native device editing preserved missing IDs, channels and startup values; invalid save and cancel passed.'

            Invoke-UiName $env:MIXLIVE_UI_EDIT
            $null = Wait-UiName $env:MIXLIVE_UI_SAVE -Enabled
            if ((Wait-UiName $env:MIXLIVE_UI_START).Current.IsEnabled) { throw 'Audio start must be disabled while editing' }
            if ((Read-UiValue $env:MIXLIVE_UI_TRIM) -cne '1.25') { throw 'Saved mic trim was not loaded into the editor' }
            Invoke-UiName $env:MIXLIVE_UI_SCAN_VST3
            $null = Wait-UiName $env:MIXLIVE_UI_SCAN_COMPLETE -Enabled
            $null = Wait-UiName $env:MIXLIVE_UI_SAVE -Enabled
            if (Find-UiName $env:MIXLIVE_UI_THIRD_SLOT) { throw 'Scanning unexpectedly appended a plugin slot' }
            Set-UiValue $env:MIXLIVE_UI_TRIM '3.5'
            if ((Read-UiValue $env:MIXLIVE_UI_REVERB) -cne '0.125') { throw 'Saved reverb was not loaded' }
            Set-UiValue $env:MIXLIVE_UI_REVERB '0.25'
            if ((Read-UiValue $env:MIXLIVE_UI_ECHO) -cne '0.125') { throw 'Saved echo was not loaded' }
            Set-UiValue $env:MIXLIVE_UI_ECHO '0.5'
            if ((Read-UiValue $env:MIXLIVE_UI_EQ_HPF) -cne '75') { throw 'Saved HPF was not loaded' }
            Set-UiValue $env:MIXLIVE_UI_EQ_HPF '110'
            Set-UiValue $env:MIXLIVE_UI_RATIO '6'
            Invoke-UiName $env:MIXLIVE_UI_BYPASS_SECOND_ON
            $null = Wait-UiName $env:MIXLIVE_UI_BYPASS_SECOND_OFF -Enabled
            Invoke-UiName $env:MIXLIVE_UI_MOVE_SECOND
            Invoke-UiName $env:MIXLIVE_UI_CANCEL
            $null = Wait-UiName $env:MIXLIVE_UI_START -Enabled
            if ((Get-FileHash -LiteralPath $originalPath -Algorithm SHA256).Hash -ne $originalHash) {
              throw 'Cancelling sound edits changed the original Scene file'
            }

            Invoke-UiName $env:MIXLIVE_UI_EDIT
            $null = Wait-UiName $env:MIXLIVE_UI_SAVE -Enabled
            if ((Read-UiValue $env:MIXLIVE_UI_TRIM) -cne '1.25') { throw 'Cancelled edits changed the selected Scene' }
            Set-UiValue $env:MIXLIVE_UI_TRIM '3.5'
            Set-UiValue $env:MIXLIVE_UI_BLEND '0.5'
            if ((Read-UiValue $env:MIXLIVE_UI_EQ_HPF) -cne '75' -or (Read-UiValue $env:MIXLIVE_UI_RATIO) -cne '2.5') { throw 'Cancelled EQ/dynamics edit changed the selected Scene' }
            Set-UiValue $env:MIXLIVE_UI_EQ_HPF '95'
            Set-UiValue $env:MIXLIVE_UI_EQ_BODY '1.5'
            Set-UiValue $env:MIXLIVE_UI_RATIO '3.5'
            Set-UiValue $env:MIXLIVE_UI_DEESS_MAX '7'
            if ((Read-UiValue $env:MIXLIVE_UI_REVERB) -cne '0.125') { throw 'Cancelled reverb edit changed the selected Scene' }
            Set-UiValue $env:MIXLIVE_UI_REVERB '0.375'
            Set-UiValue $env:MIXLIVE_UI_REVERB_DECAY '2.5'
            Set-UiValue $env:MIXLIVE_UI_REVERB_PREDELAY '25'
            if ((Read-UiValue $env:MIXLIVE_UI_ECHO) -cne '0.125') { throw 'Cancelled echo edit changed the selected Scene' }
            Set-UiValue $env:MIXLIVE_UI_ECHO '0.375'
            Set-UiValue $env:MIXLIVE_UI_ECHO_TIME '420'
            Set-UiValue $env:MIXLIVE_UI_ECHO_FEEDBACK '0.625'
            Invoke-UiName $env:MIXLIVE_UI_BYPASS_SECOND_ON
            $null = Wait-UiName $env:MIXLIVE_UI_BYPASS_SECOND_OFF -Enabled
            Invoke-UiName $env:MIXLIVE_UI_MOVE_SECOND
            Invoke-UiName $env:MIXLIVE_UI_SAVE

            # GPUI uses the in-process IFileSaveDialog. Target the observed dialog HWND.
            $dialogCondition = [System.Windows.Automation.AndCondition]::new(
              [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id),
              [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ClassNameProperty, '#32770'))
            $limit = [DateTime]::UtcNow.AddSeconds(10)
            do {
              $dialogs = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants, $dialogCondition)
              if ($dialogs.Count -eq 1) { break }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $limit)
            if ($dialogs.Count -ne 1) { throw "Expected one native Scene save dialog; observed $($dialogs.Count)" }
            $dialog = $dialogs[0]
            $dialogHandle = [IntPtr]$dialog.Current.NativeWindowHandle
            $activated = [NativeDialogWindow]::SetForegroundWindow($dialogHandle)
            $limit = [DateTime]::UtcNow.AddSeconds(10)
            do {
              $foreground = [NativeDialogWindow]::GetForegroundWindow()
              if ($foreground -eq $dialogHandle) { break }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $limit)
            if ($foreground -ne $dialogHandle) {
              throw "Native save dialog did not become foreground: expected=$dialogHandle; actual=$foreground; activation=$activated"
            }
            # The English runner's standard Save As uses Alt+N for File name.
            # Copy readback acknowledges actual input processing across processes before Save.
            [System.Windows.Forms.Clipboard]::Clear()
            $escapedPath = [regex]::Replace($savedPath, '[+^%~(){}\[\]]',
              [System.Text.RegularExpressions.MatchEvaluator]{ param($match) '{' + $match.Value + '}' })
            [System.Windows.Forms.SendKeys]::SendWait('%n^a' + $escapedPath + '^a^c')
            $limit = [DateTime]::UtcNow.AddSeconds(10)
            $observedPath = ''
            do {
              $foreground = [NativeDialogWindow]::GetForegroundWindow()
              if ($foreground -ne $dialogHandle) { throw "Native save dialog lost foreground: expected=$dialogHandle; actual=$foreground" }
              if ([System.Windows.Forms.Clipboard]::ContainsText([System.Windows.Forms.TextDataFormat]::UnicodeText)) {
                $observedPath = [System.Windows.Forms.Clipboard]::GetText([System.Windows.Forms.TextDataFormat]::UnicodeText)
              }
              if ($observedPath -ceq $savedPath) { break }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $limit)
            if ($observedPath -cne $savedPath) { throw "Native filename readback mismatch: expected=$savedPath; actual=$observedPath" }
            Write-Output "Native save filename readback matched: hwnd=$dialogHandle; path=$observedPath"
            # The native Save control is also absent from the runner's managed UIA tree.
            [System.Windows.Forms.SendKeys]::SendWait('%s')
            $null = Wait-UiName $env:MIXLIVE_UI_EDIT -Enabled
            $null = Wait-UiName $env:MIXLIVE_UI_START -Enabled
            if (!(Test-Path -LiteralPath $savedPath)) { throw 'The edited Scene was not saved to the chosen new file' }
            $saved = Get-Content -LiteralPath $savedPath -Raw | ConvertFrom-Json
            if ($saved.schema -ne 11 -or $saved.route.input_gain_db -ne 3.5 -or $saved.route.vocal_strength -ne 0.5 -or
                $saved.route.reverb_mix -ne 0.375 -or $saved.route.reverb_decay_secs -ne 2.5 -or $saved.route.reverb_predelay_ms -ne 25 -or
                $saved.route.echo_mix -ne 0.375 -or $saved.route.echo_time_ms -ne 420 -or $saved.route.echo_feedback -ne 0.625 -or
                $saved.route.eq_hpf_hz -ne 95 -or $saved.route.eq_body_db -ne 1.5 -or
                $saved.route.compressor_ratio -ne 3.5 -or $saved.route.deess_max_db -ne 7) {
              throw 'The saved Scene did not contain the edited vocal values'
            }
            foreach ($field in $scene.route.Keys) {
              if ($field -in @('input_gain_db', 'vocal_strength', 'reverb_mix', 'reverb_decay_secs', 'reverb_predelay_ms', 'echo_mix', 'echo_time_ms', 'echo_feedback', 'eq_hpf_hz', 'eq_body_db', 'compressor_ratio', 'deess_max_db')) { continue }
              $expected = $scene.route[$field]
              $actual = $saved.route.$field
              if ($field -eq 'apps') {
                if (@($actual).Count -ne $expected.Count) { throw 'Sound editing changed app source count' }
                for ($i = 0; $i -lt $expected.Count; $i++) {
                  foreach ($key in $expected[$i].Keys) {
                    if ($key -eq 'channels') {
                      if (($actual[$i].channels -join ',') -cne ($expected[$i].channels -join ',')) { throw 'Sound editing changed app channels' }
                    } elseif ($actual[$i].$key -cne $expected[$i][$key]) {
                      throw "Sound editing changed app slot $i field $key"
                    }
                  }
                }
              } elseif ($expected -is [array]) {
                if (@($actual).Count -ne $expected.Count -or ($actual -join ',') -cne ($expected -join ',')) {
                  throw "Sound editing changed the route array: $field"
                }
              } elseif ($field -eq 'mix') {
                foreach ($key in $expected.Keys) {
                  if ($actual.$key -cne $expected[$key]) { throw "Sound editing changed the saved mixer field: $key" }
                }
              } elseif ($actual -cne $expected) { throw "Sound editing changed the route field: $field" }
            }
            if ($saved.effects.Count -ne 2) { throw 'Sound editing changed the number of VST3 slots' }
            for ($slot = 0; $slot -lt 2; $slot++) {
              $expected = $scene.effects[1 - $slot]
              $actual = $saved.effects[$slot]
              if ($actual.bypassed -ne ($slot -eq 0)) { throw "Reordering VST3 slots lost the edited bypass state at slot $slot" }
              if ([IO.Path]::GetFullPath($actual.plugin) -ne [IO.Path]::GetFullPath($expected.plugin) -or
                  $actual.class_id -cne $expected.class_id -or ($actual.state -join ',') -cne ($expected.state -join ',')) {
                throw "Reordering VST3 slots lost the matching path/class/state at slot $slot"
              }
            }
            if ((Get-FileHash -LiteralPath $originalPath -Algorithm SHA256).Hash -ne $originalHash) {
              throw 'Saving sound edits replaced the original Scene file'
            }
            Invoke-UiName $env:MIXLIVE_UI_EDIT
            if ((Read-UiValue $env:MIXLIVE_UI_TRIM) -cne '3.5' -or (Read-UiValue $env:MIXLIVE_UI_BLEND) -cne '0.5' -or
                (Read-UiValue $env:MIXLIVE_UI_REVERB) -cne '0.375' -or (Read-UiValue $env:MIXLIVE_UI_REVERB_DECAY) -cne '2.5' -or
                (Read-UiValue $env:MIXLIVE_UI_REVERB_PREDELAY) -cne '25' -or
                (Read-UiValue $env:MIXLIVE_UI_ECHO) -cne '0.375' -or (Read-UiValue $env:MIXLIVE_UI_ECHO_TIME) -cne '420' -or
                (Read-UiValue $env:MIXLIVE_UI_ECHO_FEEDBACK) -cne '0.625' -or
                (Read-UiValue $env:MIXLIVE_UI_EQ_HPF) -cne '95' -or (Read-UiValue $env:MIXLIVE_UI_EQ_BODY) -cne '1.5' -or
                (Read-UiValue $env:MIXLIVE_UI_RATIO) -cne '3.5' -or (Read-UiValue $env:MIXLIVE_UI_DEESS_MAX) -cne '7') {
              throw 'Saving did not select the newly saved Scene'
            }
            Invoke-UiName $env:MIXLIVE_UI_CANCEL
            $null = Wait-UiName $env:MIXLIVE_UI_START -Enabled
            if (!$app.CloseMainWindow()) { throw 'MixLive did not accept window close after Scene editing' }
            if (!$app.WaitForExit(10000)) { throw 'MixLive did not exit after Scene editing' }
            if ($app.ExitCode -ne 0) { throw "MixLive exited with code $($app.ExitCode)" }
            Write-Output 'Native sound editing, cancel, new-file save, route preservation and ordered VST3 states passed.'
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
            Remove-Item -LiteralPath $sceneDirectory -Recurse -Force
          }
      - name: Keep development binaries, notices and resolved dependencies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-audio-dev-${{ github.sha }}
          path: |
            Cargo.lock
            README.md
            NOTICE.md
            licenses/
            crates/mixlive-vst3/README.md
            target/release/mixlive.exe
            target/release/mixlive-audio.exe
            target/release/mixlive-plugins.exe
          retention-days: 7
          if-no-files-found: error
