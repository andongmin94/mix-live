name: Audio
on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Test routing, clock boundaries, vocal processing, Scene UI state and plugin files
        run: cargo test --workspace --locked
      - name: Fetch the existing gain fixture (source only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: coupler-rs/vst3-rs
          ref: b2a45f2d40e602eff5a224b41613735388868590
          path: .fixtures/vst3-rs
          persist-credentials: false
      - name: Fetch the existing state fixture (source only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HelgeSverre/rust-vst3-host
          ref: 6c64cdffc6740cce0b4c5b6916724697b0ef9ff8
          path: .fixtures/rust-vst3-host
          persist-credentials: false
      - name: Build two native fixtures without installing plugins
        run: |
          $fixtureTarget = Join-Path $env:RUNNER_TEMP 'mixlive-vst3-fixtures'
          cargo build --manifest-path .fixtures/vst3-rs/Cargo.toml -p vst3 --example gain --target-dir $fixtureTarget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path .fixtures/rust-vst3-host/Cargo.toml -p vst3-host-testplug --lib --target-dir $fixtureTarget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gain = Join-Path $fixtureTarget 'gain.vst3'
          $state = Join-Path $fixtureTarget 'state.vst3'
          Copy-Item (Join-Path $fixtureTarget 'debug/examples/gain.dll') $gain
          Copy-Item (Join-Path $fixtureTarget 'debug/vst3_host_testplug.dll') $state
          "MIXLIVE_GAIN_VST3=$gain" >> $env:GITHUB_ENV
          "MIXLIVE_STATE_VST3=$state" >> $env:GITHUB_ENV
      - name: Check native VST3 worker, state, editor contracts and WAV output
        run: cargo test -p mixlive-vst3 -p mixlive-audio-windows --tests --locked -- --ignored
      - name: Lint current targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Windows app and development tools
        run: cargo build --release -p mixlive-app -p mixlive-audio-windows -p mixlive-vst3 --bins --locked
      - name: Check CLIs without opening devices
        run: |
          ./target/release/mixlive-audio.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/mixlive-audio.exe run --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/mixlive-plugins.exe inspect --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/mixlive-plugins.exe render --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/mixlive-plugins.exe edit --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native Scene creation and sound editing without opening audio or plugins
        shell: powershell
        timeout-minutes: 3
        env:
          # Preserve Unicode labels when the generated script is read by Windows PowerShell 5.1.
          MIXLIVE_UI_NEW: '새 Scene'
          MIXLIVE_UI_START: '오디오 시작'
          MIXLIVE_UI_SAVE: '새 Scene 파일로 저장'
          MIXLIVE_UI_CANCEL: '새 Scene 취소'
          MIXLIVE_UI_MIC: '내 목소리 · 필수'
          MIXLIVE_UI_OUTPUT: '주 출력 · 필수'
          MIXLIVE_UI_REQUIRED: '내 목소리 입력 장치를 선택하세요.'
          MIXLIVE_UI_EDIT: '보컬 설정'
          MIXLIVE_UI_TRIM: '마이크 입력 trim'
          MIXLIVE_UI_BLEND: '보컬 보정 비율'
          MIXLIVE_UI_MOVE_SECOND: 'VST3 2 위로'
          MIXLIVE_UI_WORKSPACE: 'Scene 작업 영역'
          MIXLIVE_UI_SUGGESTED_FILENAME: '새 Scene.mixlive-scene.json'
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          function Find-UiName([string]$name) {
            $condition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, $name)
            $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
          }
          function Wait-UiName([string]$name, [switch]$Enabled) {
            $limit = [DateTime]::UtcNow.AddSeconds(10)
            do {
              $app.Refresh()
              if ($app.HasExited) { throw "MixLive exited while waiting for a control: $($app.ExitCode)" }
              $element = Find-UiName $name
              if ($null -ne $element -and (!$Enabled -or $element.Current.IsEnabled)) { return $element }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $limit)
            throw "MixLive did not expose the expected control: $name"
          }
          function Invoke-UiName([string]$name) {
            $element = Wait-UiName $name -Enabled
            $element.SetFocus()
            # GPUI Design buttons request native autoscroll on focus. Wait for the revealed frame.
            $limit = [DateTime]::UtcNow.AddSeconds(10)
            do {
              $element = Wait-UiName $name -Enabled
              $area = (Wait-UiName $env:MIXLIVE_UI_WORKSPACE).Current.BoundingRectangle
              $bounds = $element.Current.BoundingRectangle
              $focused = $element.Current.HasKeyboardFocus
              $centerX = $bounds.Left + $bounds.Width / 2
              $centerY = $bounds.Top + $bounds.Height / 2
              # GPUI activates at the AX bounds center. Button focus reveal excludes its 1px border.
              if ($focused -and $bounds.Width -gt 0 -and $bounds.Height -gt 0 -and
                  $centerY -gt $area.Top -and $centerY -lt $area.Bottom -and
                  $centerX -gt $area.Left -and $centerX -lt $area.Right) {
                Write-Output ("UIA Invoke {0}: focused={1}; bounds={2}; workspace={3}; center=({4},{5})" -f
                  $name, $focused, $bounds, $area, $centerX, $centerY)
                ([System.Windows.Automation.InvokePattern]$element.GetCurrentPattern(
                  [System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
                return
              }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $limit)
            throw ("MixLive did not focus and reveal the activation point: {0}; focused={1}; bounds={2}; workspace={3}; center=({4},{5})" -f
              $name, $focused, $bounds, $area, $centerX, $centerY)
          }
          function Read-UiValue([string]$name) {
            $element = Wait-UiName $name -Enabled
            ([System.Windows.Automation.ValuePattern]$element.GetCurrentPattern(
              [System.Windows.Automation.ValuePattern]::Pattern)).Current.Value
          }
          function Set-UiValue([string]$name, [string]$value) {
            $element = Wait-UiName $name -Enabled
            ([System.Windows.Automation.ValuePattern]$element.GetCurrentPattern(
              [System.Windows.Automation.ValuePattern]::Pattern)).SetValue($value)
            $limit = [DateTime]::UtcNow.AddSeconds(10)
            do {
              if ((Read-UiValue $name) -ceq $value) { return }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $limit)
            throw "MixLive did not apply the edited value: $name"
          }
          $app = Start-Process ./target/release/mixlive.exe -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
            } while (!$app.HasExited -and $app.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($app.HasExited) { throw "MixLive exited before opening its window: $($app.ExitCode)" }
            if ($app.MainWindowHandle -eq 0) { throw 'MixLive did not open its native window' }
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
            $new = Wait-UiName $env:MIXLIVE_UI_NEW -Enabled
            $start = Wait-UiName $env:MIXLIVE_UI_START
            if ($start.Current.IsEnabled) { throw 'Audio start must be disabled without a saved Scene' }
            ([System.Windows.Automation.InvokePattern]$new.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $save = Wait-UiName $env:MIXLIVE_UI_SAVE -Enabled
            $cancel = Wait-UiName $env:MIXLIVE_UI_CANCEL -Enabled
            foreach ($label in @($env:MIXLIVE_UI_MIC, $env:MIXLIVE_UI_OUTPUT)) {
              $select = Wait-UiName $label
              if ($select.Current.ControlType -ne [System.Windows.Automation.ControlType]::ComboBox) {
                throw "A required device control is not a native-accessible select: $label"
              }
              $value = $select.GetCurrentPropertyValue([System.Windows.Automation.ValuePattern]::ValueProperty, $true)
              if ($value -ne [System.Windows.Automation.AutomationElement]::NotSupported -and
                  ![string]::IsNullOrEmpty([string]$value)) {
                throw "A required device was selected automatically: $label"
              }
            }
            ([System.Windows.Automation.InvokePattern]$save.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $null = Wait-UiName $env:MIXLIVE_UI_REQUIRED
            $cancel = Wait-UiName $env:MIXLIVE_UI_CANCEL -Enabled
            ([System.Windows.Automation.InvokePattern]$cancel.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $null = Wait-UiName $env:MIXLIVE_UI_NEW -Enabled
            if ($null -ne (Find-UiName $env:MIXLIVE_UI_SAVE)) { throw 'New Scene form remained after cancelling' }
            $start = Wait-UiName $env:MIXLIVE_UI_START
            if ($start.Current.IsEnabled) { throw 'Cancelling an unsaved Scene must not enable audio start' }
            if (!$app.CloseMainWindow()) { throw 'MixLive did not accept window close' }
            if (!$app.WaitForExit(10000)) { throw 'MixLive did not exit after closing the screen' }
            if ($app.ExitCode -ne 0) { throw "MixLive exited with code $($app.ExitCode)" }
            Write-Output 'Native New Scene form, required-device validation, cancel and normal exit passed.'
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

          # Synthetic IDs and absent DLLs prove that opening/editing/saving a Scene is file-only.
          $sceneDirectory = Join-Path $env:RUNNER_TEMP ('mixlive-scene-ui-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $sceneDirectory
          $originalPath = Join-Path $sceneDirectory 'Original scene.mixlive-scene.json'
          $savedPath = Join-Path $sceneDirectory 'Edited scene.mixlive-scene.json'
          $pluginPath = Join-Path $sceneDirectory 'not-installed.vst3'
          $scene = [ordered]@{
            schema = 3
            route = [ordered]@{
              input = 'ci-absent-mic'; input_channel = 2
              aux_input = 'ci-absent-aux'; aux_channels = @(4, 3); aux_gain_db = -9; aux_to = 'both'
              output = 'ci-absent-output'; output_channels = @(4, 3)
              send = 'ci-absent-send'; send_channels = @(1)
              input_gain_db = 1.25; output_gain_db = -23; send_gain_db = -6
              vocal = 'warm'; vocal_strength = 0.75; vocal_threshold_db = -20; deess_threshold_db = -28
              queue_ms = 20
            }
            effects = @(
              [ordered]@{ plugin = $pluginPath; class_id = '0123456789ABCDEF0123456789ABCDEF'; state = @(1, 2) },
              [ordered]@{ plugin = $pluginPath; class_id = 'FEDCBA9876543210FEDCBA9876543210'; state = @(3, 4) }
            )
          }
          [IO.File]::WriteAllText($originalPath, ($scene | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))
          $originalHash = (Get-FileHash -LiteralPath $originalPath -Algorithm SHA256).Hash
          $app = Start-Process ./target/release/mixlive.exe -ArgumentList ('"{0}"' -f $originalPath) -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
            } while (!$app.HasExited -and $app.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($app.HasExited) { throw "MixLive exited before opening the synthetic Scene: $($app.ExitCode)" }
            if ($app.MainWindowHandle -eq 0) { throw 'MixLive did not open its Scene window' }
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
            $null = Wait-UiName $env:MIXLIVE_UI_START -Enabled
            Invoke-UiName $env:MIXLIVE_UI_EDIT
            $null = Wait-UiName $env:MIXLIVE_UI_SAVE -Enabled
            if ((Wait-UiName $env:MIXLIVE_UI_START).Current.IsEnabled) { throw 'Audio start must be disabled while editing' }
            if ((Read-UiValue $env:MIXLIVE_UI_TRIM) -cne '1.25') { throw 'Saved mic trim was not loaded into the editor' }
            Set-UiValue $env:MIXLIVE_UI_TRIM '3.5'
            Invoke-UiName $env:MIXLIVE_UI_MOVE_SECOND
            Invoke-UiName $env:MIXLIVE_UI_CANCEL
            $null = Wait-UiName $env:MIXLIVE_UI_START -Enabled
            if ((Get-FileHash -LiteralPath $originalPath -Algorithm SHA256).Hash -ne $originalHash) {
              throw 'Cancelling sound edits changed the original Scene file'
            }

            Invoke-UiName $env:MIXLIVE_UI_EDIT
            $null = Wait-UiName $env:MIXLIVE_UI_SAVE -Enabled
            if ((Read-UiValue $env:MIXLIVE_UI_TRIM) -cne '1.25') { throw 'Cancelled edits changed the selected Scene' }
            Set-UiValue $env:MIXLIVE_UI_TRIM '3.5'
            Set-UiValue $env:MIXLIVE_UI_BLEND '0.5'
            Invoke-UiName $env:MIXLIVE_UI_MOVE_SECOND
            Invoke-UiName $env:MIXLIVE_UI_SAVE

            # GPUI uses the in-process IFileSaveDialog. Locate its native structure, not coordinates.
            $dialogCondition = [System.Windows.Automation.AndCondition]::new(
              [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id),
              [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ClassNameProperty, '#32770'))
            $editCondition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Edit)
            $limit = [DateTime]::UtcNow.AddSeconds(10)
            do {
              $dialog = $null
              $filenameEdits = @()
              $dialogs = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants, $dialogCondition)
              if ($dialogs.Count -eq 1) {
                $dialog = $dialogs[0]
                $edits = $dialog.FindAll([System.Windows.Automation.TreeScope]::Descendants, $editCondition)
                foreach ($candidate in $edits) {
                  $candidatePattern = $null
                  if ($candidate.Current.IsEnabled -and $candidate.TryGetCurrentPattern(
                      [System.Windows.Automation.ValuePattern]::Pattern, [ref]$candidatePattern)) {
                    $candidateValue = ([System.Windows.Automation.ValuePattern]$candidatePattern).Current
                    if (!$candidateValue.IsReadOnly -and $candidateValue.Value -ceq $env:MIXLIVE_UI_SUGGESTED_FILENAME) {
                      $filenameEdits += $candidate
                    }
                  }
                }
                if ($filenameEdits.Count -eq 1) { break }
              }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $limit)
            if ($filenameEdits.Count -ne 1) {
              Write-Output ("Native save dialogs={0}; matching filename editors={1}" -f $dialogs.Count, $filenameEdits.Count)
              $candidateCondition = [System.Windows.Automation.OrCondition]::new(
                $editCondition, [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::ComboBox))
              foreach ($candidateDialog in $dialogs) {
                $candidates = $candidateDialog.FindAll([System.Windows.Automation.TreeScope]::Descendants, $candidateCondition)
                Write-Output ("Native save dialog {0}: Edit/ComboBox candidates={1}" -f $candidateDialog.Current.Name, $candidates.Count)
                foreach ($candidate in $candidates) {
                  $candidatePatterns = @($candidate.GetSupportedPatterns() | ForEach-Object { $_.ProgrammaticName })
                  $candidatePattern = $null
                  $candidateText = '<no ValuePattern>'
                  $candidateReadOnly = '<no ValuePattern>'
                  if ($candidate.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern, [ref]$candidatePattern)) {
                    $candidateValue = ([System.Windows.Automation.ValuePattern]$candidatePattern).Current
                    $candidateText = $candidateValue.Value
                    $candidateReadOnly = $candidateValue.IsReadOnly
                  }
                  Write-Output ("Native filename candidate: id={0}; name={1}; type={2}; class={3}; enabled={4}; patterns={5}; readonly={6}; value={7}" -f
                    $candidate.Current.AutomationId, $candidate.Current.Name, $candidate.Current.ControlType.ProgrammaticName,
                    $candidate.Current.ClassName, $candidate.Current.IsEnabled, ($candidatePatterns -join ', '), $candidateReadOnly, $candidateText)
                }
              }
              throw 'The native save dialog did not expose exactly one writable filename editor with the suggested name'
            }
            $filenameEdit = $filenameEdits[0]
            $filenameValue = [System.Windows.Automation.ValuePattern]$filenameEdit.GetCurrentPattern(
              [System.Windows.Automation.ValuePattern]::Pattern)
            Write-Output ("Native filename editor selected: id={0}; name={1}; type={2}; class={3}; enabled={4}; readonly={5}; value={6}" -f
              $filenameEdit.Current.AutomationId, $filenameEdit.Current.Name, $filenameEdit.Current.ControlType.ProgrammaticName,
              $filenameEdit.Current.ClassName, $filenameEdit.Current.IsEnabled, $filenameValue.Current.IsReadOnly, $filenameValue.Current.Value)
            $filenameValue.SetValue($savedPath)
            if ($filenameValue.Current.Value -cne $savedPath) { throw 'The native save dialog did not accept the chosen path' }
            $confirmCondition = [System.Windows.Automation.AndCondition]::new(
              [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::AutomationIdProperty, '1'),
              [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button))
            $confirm = $dialog.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $confirmCondition)
            if ($null -eq $confirm -or !$confirm.Current.IsEnabled) {
              $buttonCondition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
              $buttons = $dialog.FindAll([System.Windows.Automation.TreeScope]::Descendants, $buttonCondition)
              foreach ($candidate in $buttons) {
                Write-Output ("Native save dialog button: id={0}; name={1}; enabled={2}" -f
                  $candidate.Current.AutomationId, $candidate.Current.Name, $candidate.Current.IsEnabled)
              }
              throw 'The native save dialog did not expose an enabled Save button'
            }
            ([System.Windows.Automation.InvokePattern]$confirm.GetCurrentPattern(
              [System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $null = Wait-UiName $env:MIXLIVE_UI_EDIT -Enabled
            $null = Wait-UiName $env:MIXLIVE_UI_START -Enabled
            if (!(Test-Path -LiteralPath $savedPath)) { throw 'The edited Scene was not saved to the chosen new file' }
            $saved = Get-Content -LiteralPath $savedPath -Raw | ConvertFrom-Json
            if ($saved.schema -ne 3 -or $saved.route.input_gain_db -ne 3.5 -or $saved.route.vocal_strength -ne 0.5) {
              throw 'The saved Scene did not contain the edited vocal values'
            }
            foreach ($field in $scene.route.Keys) {
              if ($field -in @('input_gain_db', 'vocal_strength')) { continue }
              $expected = $scene.route[$field]
              $actual = $saved.route.$field
              if ($expected -is [array]) {
                if (@($actual).Count -ne $expected.Count -or ($actual -join ',') -cne ($expected -join ',')) {
                  throw "Sound editing changed the route array: $field"
                }
              } elseif ($actual -cne $expected) { throw "Sound editing changed the route field: $field" }
            }
            if ($saved.effects.Count -ne 2) { throw 'Sound editing changed the number of VST3 slots' }
            for ($slot = 0; $slot -lt 2; $slot++) {
              $expected = $scene.effects[1 - $slot]
              $actual = $saved.effects[$slot]
              if ([IO.Path]::GetFullPath($actual.plugin) -ne [IO.Path]::GetFullPath($expected.plugin) -or
                  $actual.class_id -cne $expected.class_id -or ($actual.state -join ',') -cne ($expected.state -join ',')) {
                throw "Reordering VST3 slots lost the matching path/class/state at slot $slot"
              }
            }
            if ((Get-FileHash -LiteralPath $originalPath -Algorithm SHA256).Hash -ne $originalHash) {
              throw 'Saving sound edits replaced the original Scene file'
            }
            Invoke-UiName $env:MIXLIVE_UI_EDIT
            if ((Read-UiValue $env:MIXLIVE_UI_TRIM) -cne '3.5' -or (Read-UiValue $env:MIXLIVE_UI_BLEND) -cne '0.5') {
              throw 'Saving did not select the newly saved Scene'
            }
            Invoke-UiName $env:MIXLIVE_UI_CANCEL
            $null = Wait-UiName $env:MIXLIVE_UI_START -Enabled
            if (!$app.CloseMainWindow()) { throw 'MixLive did not accept window close after Scene editing' }
            if (!$app.WaitForExit(10000)) { throw 'MixLive did not exit after Scene editing' }
            if ($app.ExitCode -ne 0) { throw "MixLive exited with code $($app.ExitCode)" }
            Write-Output 'Native sound editing, cancel, new-file save, route preservation and ordered VST3 states passed.'
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
            Remove-Item -LiteralPath $sceneDirectory -Recurse -Force
          }
      - name: Keep development binaries, notices and resolved dependencies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-audio-dev-${{ github.sha }}
          path: |
            Cargo.lock
            README.md
            NOTICE.md
            licenses/
            crates/mixlive-vst3/README.md
            target/release/mixlive.exe
            target/release/mixlive-audio.exe
            target/release/mixlive-plugins.exe
          retention-days: 7
          if-no-files-found: error
