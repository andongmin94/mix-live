[package]
name = "mixlive-app"
description = "MixLive's native Windows Scene and live-routing screen"
version.workspace = true
edition = "2024"
rust-version = "1.88"
publish.workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
mixlive-audio-windows = { path = "../mixlive-audio-windows" }
mixlive-effects = { path = "../mixlive-effects" }

[target.'cfg(windows)'.dependencies]
mixlive-vst3 = { path = "../mixlive-vst3" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false }
gpui-deck = { git = "https://github.com/andongmin94/gpui-deck", rev = "78c0898ccb6feba03e3a3243ac7d4729fd80aee6" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mixlive"
path = "src/main.rs"

[lints]
workspace = true
