[package]
name = "mixlive-vst3"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version = "1.85"
description = "MixLive's device-free VST3 inspection, state and WAV processing tools"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"
hound = "=3.5.1"

[target.'cfg(windows)'.dependencies]
# Control-plane use only. No CPAL, egui, MIDI input or runtime-isolation subsystem.
# The upstream real-time runner still has internal locks; it is NOT used by our audio callback.
vst3-host = { version = "=0.11.1", default-features = false }

[[bin]]
name = "mixlive-plugins"
path = "src/main.rs"

[lints]
workspace = true
