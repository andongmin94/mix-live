[package]
name = "mixlive-audio-windows"
description = "Explicit Windows device routes for MixLive; portable clock-boundary tests"
version.workspace = true
edition.workspace = true
rust-version = "1.87"
publish.workspace = true

[dependencies]
mixlive-core = { path = "../mixlive-core" }
mixlive-effects = { path = "../mixlive-effects" }
rtrb = "=0.4.0"
rubato = { version = "=5.0.1", default-features = false }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
cpal = "=0.18.2"
mixlive-vst3 = { path = "../mixlive-vst3" }
vst3-host = { version = "=0.11.1", default-features = false }

[[bin]]
name = "mixlive-audio"
path = "src/main.rs"

[lints]
workspace = true
