[workspace]
members = ["crates/mixlive-core", "crates/mixlive-effects", "crates/mixlive-audio-windows", "crates/mixlive-vst3", "crates/mixlive-app"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.74"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
